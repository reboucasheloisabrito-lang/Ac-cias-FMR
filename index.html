<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Miss - Login e Cadastro</title>

  <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
  <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
  <link
    href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Quicksand:wght@500;600;700&display=swap)"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <!-- Tela de login -->
    <section class="painel" id="telaLogin">
      <p class="legenda">Tela de Login</p>

      <div class="conteudo">
        <h1>Seja Bem-Vinda<br>ao</h1>

        <div class="logo">
          <span class="flor">🌺</span>
          <span>MISS</span>
        </div>

        <form class="formulario" id="formLogin">
          <label class="sr-only" for="loginEmail">E-mail</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="E-mail"
            autocomplete="email"
            required
          >

          <label class="sr-only" for="loginSenha">Senha</label>
          <input
            type="password"
            id="loginSenha"
            placeholder="Senha"
            autocomplete="current-password"
            minlength="6"
            required
          >

          <button type="submit">Confirmar acesso</button>
        </form>

        <p class="link-cadastro">
          Ainda não possui cadastro?
          <button type="button" class="link" id="abrirCadastro">
            Clique aqui para se cadastrar.
          </button>
        </p>

        <p class="mensagem" id="mensagemLogin" aria-live="polite"></p>
      </div>
    </section>

    <!-- Tela de cadastro -->
    <section class="painel cadastro oculto" id="telaCadastro">
      <p class="observacao">
        Caso não tenha cadastro, você será direcionada para esta tela.
      </p>

      <div class="conteudo">
        <h2>Antes de começar,<br>precisamos de<br>algumas informações</h2>

        <form class="formulario" id="formCadastro">
          <label class="sr-only" for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            placeholder="Nome"
            autocomplete="name"
            required
          >

          <label class="sr-only" for="email">E-mail</label>
          <input
            type="email"
            id="email"
            placeholder="E-mail"
            autocomplete="email"
            required
          >

          <label class="sr-only" for="nascimento">Data de nascimento</label>
          <input
            type="text"
            id="nascimento"
            placeholder="Data de Nascimento"
            inputmode="numeric"
            maxlength="10"
            required
          >

          <label class="sr-only" for="endereco">Endereço</label>
          <input
            type="text"
            id="endereco"
            placeholder="Endereço"
            autocomplete="street-address"
            required
          >

          <label class="sr-only" for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            placeholder="Senha"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <label class="sr-only" for="confirmarSenha">Confirme a senha</label>
          <input
            type="password"
            id="confirmarSenha"
            placeholder="Confirme a senha"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button type="submit">Continuar</button>
        </form>

        <button type="button" class="link voltar" id="voltarLogin">
          Voltar para o login
        </button>

        <p class="mensagem" id="mensagemCadastro" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
